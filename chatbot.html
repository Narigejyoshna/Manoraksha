<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manoraksha Chatbot</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background: #f8f8f8; 
      padding: 20px; 
      display: flex; 
      justify-content: center; 
    }
    #chatbox { 
      width: 420px; 
      background: white; 
      padding: 20px; 
      border-radius: 12px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
      display: flex; 
      flex-direction: column; 
    }
    #messages { 
      flex: 1; 
      overflow-y: auto; 
      max-height: 350px; 
      margin-bottom: 15px; 
    }
    .message { 
      margin: 6px 0; 
      padding: 10px; 
      border-radius: 8px; 
      max-width: 80%; 
      line-height: 1.4; 
    }
    .user { 
      background: #d1e7dd; 
      align-self: flex-end; 
    }
    .bot { 
      background: #f8d7da; 
      align-self: flex-start; 
    }
    #input-area { 
      display: flex; 
      gap: 8px; 
    }
    #userInput { 
      flex: 1; 
      padding: 10px; 
      border: 1px solid #ccc; 
      border-radius: 6px; 
    }
    button { 
      padding: 10px 14px; 
      border: none; 
      border-radius: 6px; 
      background: #007bff; 
      color: white; 
      cursor: pointer; 
    }
    button:hover { background: #0056b3; }

    /* Suggestions */
    #suggestions { 
      margin-top: 12px; 
      display: flex; 
      flex-wrap: wrap; 
      gap: 8px; 
    }
    .suggestion { 
      background: #e9ecef; 
      padding: 8px 12px; 
      border-radius: 20px; 
      cursor: pointer; 
      font-size: 14px; 
      transition: background 0.2s; 
    }
    .suggestion:hover { background: #d6d8db; }
  </style>
</head>
<body>
  <div id="chatbox">
    <div id="messages"></div>

    <div id="input-area">
      <input type="text" id="userInput" placeholder="Type a message...">
      <button onclick="sendMessage()">Send</button>
    </div>

    <div id="suggestions">
      <div class="suggestion" onclick="sendSuggestion('I feel anxious')">I feel anxious</div>
      <div class="suggestion" onclick="sendSuggestion('I need help with stress')">I need help with stress</div>
      <div class="suggestion" onclick="sendSuggestion('Can I book a session?')">Can I book a session?</div>
      <div class="suggestion" onclick="sendSuggestion('Tell me relaxation tips')">Tell me relaxation tips</div>
    </div>
  </div>

  <script>
    async function sendMessage(userMessage = null) {
      const input = document.getElementById("userInput");
      let message = userMessage || input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";

      try {
        const response = await fetch("http://localhost:5000/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: message })
        });

        if (!response.ok) throw new Error("Network error");

        const data = await response.json();
        addMessage(data.reply, "bot");
      } catch (err) {
        addMessage("⚠️ Sorry, I couldn’t connect to the server.", "bot");
      }
    }

    function sendSuggestion(text) {
      sendMessage(text);
    }

    function addMessage(text, sender) {
      const messagesDiv = document.getElementById("messages");
      const msg = document.createElement("div");
      msg.className = "message " + sender;
      msg.innerText = text;
      messagesDiv.appendChild(msg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
  </script>
</body>
</html>
