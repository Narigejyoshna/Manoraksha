<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Student & Admin Signup/Login</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f8fafc;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  .container {
    background: white;
    width: 380px;
    padding: 24px;
    border-radius: 10px;
    box-shadow: 0 3px 9px rgba(0,0,0,0.15);
  }
  h2 {
    text-align: center;
    color: #15803d;
    margin-bottom: 16px;
  }
  .tab-buttons {
    display: flex;
    margin-bottom: 20px;
  }
  .tab-buttons button {
    flex: 1;
    padding: 12px;
    font-weight: bold;
    border: none;
    background: #e0e0e0;
    cursor: pointer;
    border-radius: 8px 8px 0 0;
    transition: background 0.3s;
  }
  .tab-buttons button.active {
    background: #15803d;
    color: white;
  }
  form {
    display: none;
    flex-direction: column;
  }
  form.active {
    display: flex;
  }
  label {
    font-weight: 600;
    margin-bottom: 6px;
    color: #444;
  }
  input[type="text"],
  input[type="password"],
  input[type="email"],
  select {
    padding: 8px;
    margin-bottom: 16px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 1em;
  }
  button.submit-btn {
    background: #15803d;
    border: none;
    padding: 12px;
    border-radius: 6px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.3s;
  }
  button.submit-btn:hover {
    background: #166534;
  }
  .message {
    font-weight: 600;
    margin-bottom: 12px;
    height: 20px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="container">
  <h2>Welcome to Manoraksha</h2>
  <div class="tab-buttons">
    <button class="tab-btn active" data-target="studentSignup">Student Sign-Up</button>
    <button class="tab-btn" data-target="adminSignup">Admin Sign-Up</button>
    <button class="tab-btn" data-target="login">Login</button>
  </div>

  <div id="message" class="message"></div>

  <form id="studentSignup" class="active">
    <label for="stuName">Name</label>
    <input type="text" id="stuName" placeholder="Student Name" required />
    <label for="stuEmail">Email</label>
    <input type="email" id="stuEmail" placeholder="student@example.com" required />
    <label for="stuPassword">Password</label>
    <input type="password" id="stuPassword" placeholder="Password" required />
    <button type="submit" class="submit-btn">Sign Up as Student</button>
  </form>

  <form id="adminSignup">
    <label for="adminName">Name</label>
    <input type="text" id="adminName" placeholder="Admin Name" required />
    <label for="adminEmail">Email</label>
    <input type="email" id="adminEmail" placeholder="admin@example.com" required />
    <label for="adminPassword">Password</label>
    <input type="password" id="adminPassword" placeholder="Password" required />
    <button type="submit" class="submit-btn">Sign Up as Admin</button>
  </form>

  <form id="login">
    <label for="loginEmail">Email</label>
    <input type="email" id="loginEmail" placeholder="Email" required />
    <label for="loginPassword">Password</label>
    <input type="password" id="loginPassword" placeholder="Password" required />
    <label for="userType">User Type</label>
    <select id="userType" required>
      <option value="" disabled selected>Select user type</option>
      <option value="student">Student</option>
      <option value="admin">Admin</option>
    </select>
    <button type="submit" class="submit-btn">Login</button>
  </form>
</div>

<script>
  const tabButtons = document.querySelectorAll('.tab-btn');
  const forms = {
    studentSignup: document.getElementById('studentSignup'),
    adminSignup: document.getElementById('adminSignup'),
    login: document.getElementById('login'),
  };
  const messageDiv = document.getElementById('message');

  function setActiveTab(target) {
    tabButtons.forEach(btn => btn.classList.toggle('active', btn.getAttribute('data-target') === target));
    Object.keys(forms).forEach(key => {
      forms[key].classList.toggle('active', key === target);
    });
    messageDiv.textContent = '';
  }

  tabButtons.forEach(button => {
    button.addEventListener('click', () => {
      setActiveTab(button.getAttribute('data-target'));
    });
  });

  // Helpers to manipulate localStorage users
  function getUsers(type) {
    return JSON.parse(localStorage.getItem(type)) || [];
  }
  function saveUser(type, user) {
    const users = getUsers(type);
    users.push(user);
    localStorage.setItem(type, JSON.stringify(users));
  }
  function findUser(type, email, password) {
    const users = getUsers(type);
    return users.find(u => u.email === email && u.password === password);
  }
  function userExists(type, email) {
    const users = getUsers(type);
    return users.some(u => u.email === email);
  }

  // Student sign up
  forms.studentSignup.addEventListener('submit', e => {
    e.preventDefault();
    const name = document.getElementById('stuName').value.trim();
    const email = document.getElementById('stuEmail').value.trim();
    const password = document.getElementById('stuPassword').value;
    if(userExists('students', email)) {
      messageDiv.style.color = 'red';
      messageDiv.textContent = 'Student email already registered. Please login.';
      setActiveTab('login');
      return;
    }
    saveUser('students', { name, email, password });
    messageDiv.style.color = 'green';
    messageDiv.textContent = 'Student registered successfully! Please login.';
    forms.studentSignup.reset();
    setActiveTab('login');
  });

  // Admin sign up
  forms.adminSignup.addEventListener('submit', e => {
    e.preventDefault();
    const name = document.getElementById('adminName').value.trim();
    const email = document.getElementById('adminEmail').value.trim();
    const password = document.getElementById('adminPassword').value;
    if(userExists('admins', email)) {
      messageDiv.style.color = 'red';
      messageDiv.textContent = 'Admin email already registered. Please login.';
      setActiveTab('login');
      return;
    }
    saveUser('admins', { name, email, password });
    messageDiv.style.color = 'green';
    messageDiv.textContent = 'Admin registered successfully! Please login.';
    forms.adminSignup.reset();
    setActiveTab('login');
  });

  // Login form submit handler with redirect on success
  forms.login.addEventListener('submit', e => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const userType = document.getElementById('userType').value;

    if(!userType) {
      messageDiv.style.color = 'red';
      messageDiv.textContent = 'Please select user type.';
      return;
    }

    const userFound = findUser(userType === 'student' ? 'students' : 'admins', email, password);
    if(userFound) {
      messageDiv.style.color = 'green';
      messageDiv.textContent = `${userType.charAt(0).toUpperCase() + userType.slice(1)} login successful! Welcome, ${userFound.name}`;

      // Redirect to index.html after 1 second delay
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1000);
    } else {
      messageDiv.style.color = 'red';
      messageDiv.textContent = 'Login failed: Invalid credentials.';
    }
    forms.login.reset();
  });

  // Show student signup form by default on page load
  setActiveTab('studentSignup');
</script>
</body>
</html>
