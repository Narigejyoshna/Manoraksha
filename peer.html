<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Peer Support Forum</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #007bff;
      padding: 20px;
      color: white;
      text-align: center;
    }
    .container {
      width: 80%;
      margin: 0 auto;
      padding: 20px;
    }
    .guidelines {
      background-color: #84c5e8;
      padding: 10px;
      margin-bottom: 20px;
      border-radius: 5px;
    }
    .forum-posts {
      margin-top: 30px;
    }
    .post {
      background-color: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .post .username {
      font-weight: bold;
    }
    .reply, .nested-reply {
      background: #f9f9f9;
      margin: 10px 0 0 20px;
      padding: 10px;
      border-left: 3px solid #007bff;
      border-radius: 5px;
    }
    .reply-input, .nested-reply-input {
      width: 100%;
      margin-top: 10px;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    .reply-btn, .nested-reply-btn {
      margin-top: 5px;
      background: #007bff;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 5px;
      cursor: pointer;
    }
    .reply-btn:hover, .nested-reply-btn:hover {
      background: #0056b3;
    }
    .new-post-btn {
      background-color: #28a745;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .new-post-btn:hover {
      background-color: #218838;
    }

    /* Modal */
    #createPostModal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      border-radius: 10px;
      padding: 20px;
      width: 400px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      z-index: 1000;
    }
    .create-post-form label {
      font-weight: bold;
      display: block;
      margin-top: 10px;
    }
    .create-post-form input, 
    .create-post-form textarea, 
    .create-post-form select {
      width: 100%;
      padding: 10px;
      margin: 5px 0 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .form-actions button {
      padding: 8px 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #cancelButton {
      background: #ddd;
    }
    #postButton {
      background: #007bff;
      color: white;
    }
    #postButton:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <header>
    <h1>Peer Support Forum</h1>
    <p>Connect, share, and support each other in a safe space.</p>
  </header>

  <div class="container">
    <div class="guidelines">
      <p><strong>Community Guidelines</strong><br>
        Be kind and respectful. This is a supportive space. Posts are moderated to ensure safety. For immediate help, use the crisis support line.</p>
    </div>

    <div class="forum-posts">
      <!-- Posts will load here -->
    </div>

    <div>
      <button class="new-post-btn" id="createPostBtn">+ New Post</button>
    </div>

    <!-- Modal -->
    <div id="createPostModal">
      <div class="create-post-form">
        <h3>Create a New Post</h3>

        <label for="postTitle">Title</label>
        <input type="text" id="postTitle" placeholder="Title">

        <label for="postContent">Your thoughts</label>
        <textarea id="postContent" rows="4" placeholder="Your thoughts..."></textarea>

        <label for="postCategory">Category</label>
        <select id="postCategory">
          <option value="General Support">General Support</option>
          <option value="Study Tips">Study Tips</option>
          <option value="Stress Relief">Stress Relief</option>
          <option value="Other">Other</option>
        </select>

        <div>
          <input type="checkbox" id="postAnonymous">
          <label for="postAnonymous">Post Anonymously</label>
        </div>

        <div class="form-actions">
          <button id="cancelButton">Cancel</button>
          <button id="postButton">Post</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Show modal
    $('#createPostBtn').on('click', function () {
      $('#createPostModal').show();
    });

    // Cancel modal
    $('#cancelButton').on('click', function () {
      $('#createPostModal').hide();
    });

    // Create new post
    $('#postButton').on('click', function () {
      const title = $('#postTitle').val();
      const content = $('#postContent').val();
      const category = $('#postCategory').val();
      const isAnonymous = $('#postAnonymous').prop('checked');

      if (title && content) {
        const username = isAnonymous ? "Anonymous User" : "User";
        const date = new Date().toLocaleDateString();

        const newPost = `
          <div class="post">
            <h3>${title}</h3>
            <p class="username">${username} • ${date} • <em>${category}</em></p>
            <p>${content}</p>
            <div class="replies"></div>
            <textarea class="reply-input" placeholder="Write a supportive reply..."></textarea>
            <button class="reply-btn">Reply</button>
          </div>
        `;

        $('.forum-posts').prepend(newPost);
        $('#createPostModal').hide();
        $('#postTitle').val('');
        $('#postContent').val('');
        $('#postCategory').val('General Support');
        $('#postAnonymous').prop('checked', false);
      }
    });

    // Handle reply
    $(document).on('click', '.reply-btn', function () {
      const replyText = $(this).prev('.reply-input').val();
      if (replyText) {
        const username = "Peer";
        const dateTime = new Date().toLocaleString();

        const newReply = `
          <div class="reply">
            <p class="username">${username} • ${dateTime}</p>
            <p>${replyText}</p>
            <div class="nested-replies"></div>
            <textarea class="nested-reply-input" placeholder="Reply back..."></textarea>
            <button class="nested-reply-btn">Respond</button>
          </div>
        `;

        $(this).siblings('.replies').append(newReply);
        $(this).prev('.reply-input').val('');
      }
    });

    // Handle nested replies
    $(document).on('click', '.nested-reply-btn', function () {
      const nestedReplyText = $(this).prev('.nested-reply-input').val();
      if (nestedReplyText) {
        const username = "Original Poster";
        const dateTime = new Date().toLocaleString();

        const newNestedReply = `
          <div class="nested-reply">
            <p class="username">${username} • ${dateTime}</p>
            <p>${nestedReplyText}</p>
          </div>
        `;

        $(this).siblings('.nested-replies').append(newNestedReply);
        $(this).prev('.nested-reply-input').val('');
      }
    });
  </script>
</body>
</html>
